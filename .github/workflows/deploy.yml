name: Build and deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test
          pnpm run build

      - name: Configure SSH client and host-key compatibility
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host deploy-vps
            HostName $SERVER_IP
            User $SERVER_USER
            Port 5522
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            UserKnownHostsFile ~/.ssh/known_hosts
            StrictHostKeyChecking yes
            HostKeyAlgorithms +ssh-rsa
          EOF
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/config

      - name: Upload release and switch atomically
        env:
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          release_path="$SERVER_DEPLOY_PATH/releases/${GITHUB_SHA}"
          ssh deploy-vps "mkdir -p '$release_path' '$SERVER_DEPLOY_PATH/scripts'"
          rsync -az --delete -e 'ssh -F ~/.ssh/config' frontend/dist/ "deploy-vps:$release_path/"
          rsync -az -e 'ssh -F ~/.ssh/config' backend/scripts/deploy.sh "deploy-vps:$SERVER_DEPLOY_PATH/scripts/deploy.sh"
          ssh deploy-vps "chmod 700 '$SERVER_DEPLOY_PATH/scripts/deploy.sh' && '$SERVER_DEPLOY_PATH/scripts/deploy.sh' '$release_path' '$SERVER_DEPLOY_PATH/current'"
