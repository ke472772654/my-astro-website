name: Build and deploy static site

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run test
          pnpm run build

      - name: Configure SSH client
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload release and switch atomically
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          release_path="$DEPLOY_PATH/releases/${GITHUB_SHA}"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$release_path' '$DEPLOY_PATH/scripts'"
          rsync -az --delete -e 'ssh -i ~/.ssh/id_ed25519' frontend/dist/ "$DEPLOY_USER@$DEPLOY_HOST:$release_path/"
          rsync -az -e 'ssh -i ~/.ssh/id_ed25519' backend/scripts/deploy.sh "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/scripts/deploy.sh"
          ssh -i ~/.ssh/id_ed25519 "$DEPLOY_USER@$DEPLOY_HOST" "chmod 700 '$DEPLOY_PATH/scripts/deploy.sh' && '$DEPLOY_PATH/scripts/deploy.sh' '$release_path' '$DEPLOY_PATH/current'"
