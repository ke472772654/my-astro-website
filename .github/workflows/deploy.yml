name: Build and deploy static site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install and verify frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
          pnpm run test

      - name: Configure SSH private key
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload release and switch atomically
        env:
          SERVER_IP: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_DEPLOY_PATH: ${{ secrets.SERVER_DEPLOY_PATH }}
        run: |
          release_path="$SERVER_DEPLOY_PATH/releases/${GITHUB_SHA}"
          ssh_command='ssh -i ~/.ssh/id_ed25519 -p 5522 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
          ssh $ssh_command "$SERVER_USER@$SERVER_IP" "mkdir -p '$release_path' '$SERVER_DEPLOY_PATH/scripts'"
          rsync -az --delete -e "$ssh_command" frontend/dist/ "$SERVER_USER@$SERVER_IP:$release_path/"
          rsync -az -e "$ssh_command" backend/scripts/deploy.sh "$SERVER_USER@$SERVER_IP:$SERVER_DEPLOY_PATH/scripts/deploy.sh"
          ssh $ssh_command "$SERVER_USER@$SERVER_IP" "chmod 700 '$SERVER_DEPLOY_PATH/scripts/deploy.sh' && '$SERVER_DEPLOY_PATH/scripts/deploy.sh' '$release_path' '$SERVER_DEPLOY_PATH/current'"
